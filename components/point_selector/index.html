<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: system-ui, sans-serif; color: #202124; }
    #toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 0 8px; font-size: 13px; }
    button { border: 1px solid #bbb; border-radius: 5px; padding: 4px 10px; background: white; cursor: pointer; }
    #wrap { position: relative; width: 100%; overflow: hidden; border: 1px solid #ddd; background: #f5f5f5; }
    canvas { display: block; width: 100%; cursor: crosshair; }
    .hint { color: #666; }
  </style>
</head>
<body>
  <div id="toolbar"><span id="status" class="hint">请依次点击左上、右上、右下、左下</span><button id="clear">清除</button></div>
  <div id="wrap"><canvas id="canvas"></canvas></div>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    let args = { initial_points: [], image: null, image_width: 1, image_height: 1 };
    let points = [];
    let image = new Image();

    function send(type, value) {
      window.parent.postMessage({isStreamlitMessage: true, type, value}, '*');
    }
    function setFrameHeight(height) {
      window.parent.postMessage({isStreamlitMessage: true, type: 'streamlit:setFrameHeight', height}, '*');
    }
    function ready() {
      window.parent.postMessage({isStreamlitMessage: true, type: 'streamlit:componentReady', apiVersion: 1}, '*');
      setFrameHeight(60);
    }
    function draw() {
      if (!image.complete || !image.naturalWidth) return;
      const imageWidth = Number(args.image_width);
      const imageHeight = Number(args.image_height);
      if (!Number.isFinite(imageWidth) || !Number.isFinite(imageHeight) || imageWidth <= 0 || imageHeight <= 0) return;
      const maxWidth = Math.min(1000, Math.max(320, document.body.clientWidth));
      const scale = Math.min(1, maxWidth / imageWidth);
      canvas.width = Math.max(1, Math.round(imageWidth * scale));
      canvas.height = Math.max(1, Math.round(imageHeight * scale));
      ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.strokeStyle = 'rgba(0,0,0,.78)'; ctx.lineWidth = 1;
      for (const p of points) {
        const x = p[0] * scale, y = p[1] * scale;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }
      ctx.fillStyle = '#0b57d0'; ctx.strokeStyle = 'white'; ctx.lineWidth = 2;
      points.forEach((p, i) => {
        const x = p[0] * scale, y = p[1] * scale;
        ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = 'white'; ctx.font = 'bold 11px system-ui'; ctx.fillText(String(i + 1), x - 3, y + 4); ctx.fillStyle = '#0b57d0';
      });
      status.textContent = points.length < 4 ? `请点击第 ${points.length + 1} 个角点` : '已选择 4 个角点，可重新点击覆盖或清除';
      setFrameHeight(canvas.height + 48);
    }
    canvas.addEventListener('click', (event) => {
      const rect = canvas.getBoundingClientRect();
      const x = Math.max(0, Math.min(args.image_width, (event.clientX - rect.left) * args.image_width / rect.width));
      const y = Math.max(0, Math.min(args.image_height, (event.clientY - rect.top) * args.image_height / rect.height));
      if (points.length >= 4) points = [];
      points.push([Math.round(x), Math.round(y)]);
      draw();
      send('streamlit:setComponentValue', points);
    });
    document.getElementById('clear').addEventListener('click', () => { points = []; draw(); send('streamlit:setComponentValue', []); });
    window.addEventListener('message', (event) => {
      if (!event.data || event.data.type !== 'streamlit:render') return;
      args = event.data.args || args;
      points = Array.isArray(args.initial_points) ? args.initial_points : [];
      image = new Image();
      image.onload = draw;
      image.src = 'data:image/png;base64,' + args.image;
    });
    window.addEventListener('resize', draw);
    ready();
  </script>
</body>
</html>
